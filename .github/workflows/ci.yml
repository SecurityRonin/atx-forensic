name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs. The old `coverage` job enforced 100% per-line via
  # .github/scripts/check_coverage.py, exempting `// cov:unreachable` — exactly
  # the shared workflow's default gate, and all 4 existing markers carry a
  # reason, so the default `require-exemption-reason: true` holds.
  #
  # The old run also passed `--ignore-filename-regex '(^|/)src/(main\.rs|bin/)'`.
  # That is deliberately NOT carried across: this repo has no `src/main.rs` and
  # no `src/bin/` anywhere, so the flag excluded nothing — restating a no-op as
  # an input would misrepresent it as a live decision. MSRV is read from
  # rust-version (1.80), which is what the old `msrv` job pinned by hand.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
